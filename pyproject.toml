[project]
name = "pdf-rag-assistant"
version = "0.1.0"
description = "A simple RAG application for asking questions about PDF documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastembed>=0.8.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
